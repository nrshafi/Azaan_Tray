<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <style>
    body {
      background: #1e1e1e;
      color: #fff;
      font-family: 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 16px;
      user-select: none;
    }
    h1 { font-size: 16px; margin: 0 0 8px 0; }
    p { font-size: 13px; color: #aaa; margin: 0; }
  </style>
</head>
<body>
  <h1>Azaan Tray Spike C</h1>
  <p>Ephemeral UI Loaded via Virtual Host</p>
  <script>
    function sendReady() {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify({ type: "app.ready", time: performance.now() }));
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', sendReady);
    } else {
      sendReady();
    }
  </script>
</body>
